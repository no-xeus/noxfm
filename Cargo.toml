[workspace]
resolver = "3"
members = ["crates/noxfm-proto", "crates/noxfm-core", "crates/noxd", "crates/noxfm", "crates/noxfm-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
noxfm-proto = { path = "crates/noxfm-proto" }
noxfm-core = { path = "crates/noxfm-core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "60ad2cc4c33d7500aba557cd9150e6938d72d5a1"
default-features = false
features = ["winit", "tokio", "wayland", "wgpu", "multi-window"]

# libcosmic with a fix for context-menu crashes (stale popup id after picking
# an item). Local clone at ../libcosmic, branch `noxfm-fix-popup-id`; switch
# these to `git = "<fork URL>", branch = "noxfm-fix-popup-id"` once it is pushed.
# Goes away with the GTK4 UI (docs/ui-rewrite.md).
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
build_helpers = { path = "../libcosmic/iced/build_helpers" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }
